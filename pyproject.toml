[project]
name = "thelounge-digest"
# A placeholder, never bumped: a release is the git tag vX.Y.Z that
# auto-release creates, and the image built from that tag carries the
# version in its org.opencontainers.image.version label. Nothing reads this
# field at run time.
version = "0.0.0"
description = "Scheduled IRC digests for TheLounge: reads its SQLite logs and sends nick-coloured HTML digests with trending links and keyword highlights through Apprise"
readme = "README.md"
license = "MIT"
authors = [{ name = "Michele Bologna" }]
# The Python the Dockerfile's base image ships; Renovate moves the image,
# a person moves this floor with the next minor.
requires-python = ">=3.15"
dependencies = [
    "apprise>=2.2.0",
]

[project.scripts]
# The digest run (the image's entry point); --init seeds the cursor,
# --dry-run prints the digest instead of sending it.
thelounge-digest = "thelounge_digest.digest:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
required-version = ">=0.12.12"
# Resolve only releases at least 7 days old, so a compromised release has
# time to be caught and yanked before it lands in uv.lock. For an urgent
# fix, add `<name> = false` to exclude-newer-package and run `uv lock`.
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (the formatter handles it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# The pre-commit hook passes mypy only the staged files: without this, a
# commit that touches only tests checks them against an unresolved package
# (every import Any) and leaves a cache that fails the next full run.
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["thelounge_digest"]

[tool.coverage.report]
# CI fails below this total (python-ci and ci-templates' python-test read
# it). Raise it with the tests; don't lower it to merge.
fail_under = 96
show_missing = true
