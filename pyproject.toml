[project]
name = "thelounge-digest"
version = "0.1.0"
description = "IRC digest notifier for TheLounge"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# Resolve only releases at least 7 days old; see README "Dependency updates".
exclude-newer = "7 days"
# Relative exclude-newer needs uv 0.12.12+; setup-uv in CI also reads this.
required-version = ">=0.12.12"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["digest"]
